[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-cruxes"
dynamic = ["version"]
description = "Measure how far the premises a forecaster states in advance overlap the premises its forecasts actually disagree on."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Reber", email = "davidpreber@gmail.com" }]
keywords = ["forecasting", "introspection", "premises", "clustering", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/davidreber/forecast-cruxes"
"Data release" = "https://github.com/davidreber/forecast-cruxes-data"
Verification = "https://github.com/davidreber/forecast-cruxes-verify"

[project.optional-dependencies]
# The cross encoder scoring stage. Everything else runs without it, and a test
# asserts that importing the package leaves torch out of sys.modules.
gpu = ["torch>=2.0", "transformers>=4.51"]
test = ["pytest>=7.0"]

[project.scripts]
cruxes-score = "cruxes.reranker.score:main"
cruxes-report = "cruxes.report:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "cruxes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cruxes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
