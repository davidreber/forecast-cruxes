name: publish

# Build the wheel and sdist from a version tag and publish them to PyPI with
# trusted publishing (no API token in the repository). One-time setup on
# pypi.org: project "forecast-cruxes", publisher = this repository, workflow
# "publish.yml", environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel holds the package only
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          top = sorted({n.split("/")[0] for n in names})
          assert top == ["cruxes", next(t for t in top if t.endswith(".dist-info"))], top
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
