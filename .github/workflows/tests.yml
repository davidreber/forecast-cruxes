name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU only; the scoring stage's torch extra is not needed for the tests)
        run: python -m pip install -e '.[test]'
      - name: Importing the package must not import torch
        run: python -c "import cruxes, sys; assert 'torch' not in sys.modules"
      - name: Tests
        run: python -m pytest tests -q
      - name: Dry run of the worked example
        run: cruxes-score --premises examples/premises_example.json --cache-dir "${{ runner.temp }}/caches" --dry-run
